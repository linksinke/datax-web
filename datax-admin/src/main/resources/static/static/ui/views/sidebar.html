<aside :class="{ 'has-logo': showLogo }" aria-label="主导航">
  <logo v-if="showLogo" :collapse="isCollapse"></logo>
  <el-scrollbar wrap-class="scrollbar-wrapper">
    <el-menu :default-active="activeMenu" :collapse="isCollapse" :unique-opened="false"
      :background-color="variables.menuBg" :text-color="variables.menuText"
      :active-text-color="variables.menuActiveText" :collapse-transition="false" mode="vertical">
      <sidebar-item v-for="route in menuRoutes" :key="route.path" :item="route" :base-path="route.path"></sidebar-item>
    </el-menu>
  </el-scrollbar>
</aside>
