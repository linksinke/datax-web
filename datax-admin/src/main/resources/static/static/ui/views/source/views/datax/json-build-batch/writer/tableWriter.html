<section class="ui-builder-pane"><header class="ui-section-intro"><h3>写入端连接与表范围</h3><p>选择参与构建的表；下一步可以调整左右顺序，同序号的表形成一组任务。</p></header><el-form label-position="top" :model="writerForm" :rules="rules" class="ui-form-grid"><el-form-item label="写入端数据源" prop="datasourceId"><el-select v-model="writerForm.datasourceId" filterable clearable placeholder="选择可连接的数据库" @change="wDsChange"><el-option v-for="source in wDsList" :key="source.id" :label="source.datasourceName" :value="source.id"></el-option></el-select></el-form-item>
 <el-form-item v-show="['postgresql','oracle','sqlserver'].includes(dataSource)" label="Schema"><el-select v-model="writerForm.tableSchema" filterable @change="schemaChange"><el-option v-for="schema in schemaList" :key="schema" :label="schema" :value="schema"></el-option></el-select></el-form-item><el-form-item label="目标表" class="ui-span-full"><div class="ui-selection-header"><el-checkbox :value="wTbList.length > 0 && writerForm.tables.length === wTbList.length" :indeterminate="writerForm.tables.length > 0 && writerForm.tables.length < wTbList.length" @change="wHandleCheckAllChange">全选</el-checkbox><span>已选 {{ writerForm.tables.length }} / {{ wTbList.length }} 张表</span></div><el-checkbox-group v-model="writerForm.tables" class="ui-selection-grid" @change="wHandleCheckedChange"><el-checkbox v-for="table in wTbList" :key="table" :label="table">{{ table }}</el-checkbox></el-checkbox-group><p v-if="!wTbList.length" class="ui-empty-text">选择数据源后读取可用表。</p></el-form-item></el-form></section>
