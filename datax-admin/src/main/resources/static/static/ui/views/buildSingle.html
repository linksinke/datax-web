<section class="app-container ui-page ui-build">
  <el-steps :active="active - 1" finish-status="success" align-center>
    <el-step title="选择源库" description="Reader">
    </el-step>
    <el-step title="选择目标库" description="Writer">
    </el-step>
    <el-step title="字段映射">
    </el-step>
    <el-step title="确认与创建">
    </el-step>
  </el-steps>
  <div v-show="active === 1">
    <reader ref="reader">
    </reader>
  </div>
  <div v-show="active === 2">
    <writer ref="writer">
    </writer>
  </div>
  <div v-show="active === 3">
    <mapper ref="mapper">
    </mapper>
  </div>
  <div v-show="active === 4">
    <div class="ui-panel-title">
      <h3>调度配置</h3>
      <el-button @click="uiOpenTemplates">{{ jobTemplate ? '更换模板' : '选择调度模板' }}</el-button>
    </div>
    <el-alert v-if="jobTemplate" :title="'当前模板：' + jobTemplate" type="info" :closable="false">
    </el-alert>
    <el-form :model="temp" label-position="top" style="margin-top: 20px">
      <div class="ui-form-grid">
        <el-form-item label="任务名称">
          <el-input v-model="temp.jobDesc">
          </el-input>
        </el-form-item>
        <el-form-item label="Cron 表达式">
          <el-input v-model="temp.jobCron" class="ui-code">
          </el-input>
        </el-form-item>
        <el-form-item label="超时时间（秒）">
          <el-input-number v-model="temp.executorTimeout" :min="0" controls-position="right">
          </el-input-number>
        </el-form-item>
        <el-form-item label="失败重试次数">
          <el-input-number v-model="temp.executorFailRetryCount" :min="0" controls-position="right">
          </el-input-number>
        </el-form-item>
      </div>
    </el-form>
    <div class="ui-panel-title">
      <h3>JSON 配置</h3>
      <div>
        <el-button :loading="uiPending.build" @click="uiGenerate">重新生成</el-button>
        <el-button @click="uiCopyJson">复制 JSON</el-button>
      </div>
    </div>
    <datax-json-code-editor v-model="configJson" :read-only="!!uiPending.save" @save="uiSaveBuiltTask" @format="uiFormatJson('configJson')">
    </datax-json-code-editor>
  </div>
  <div class="ui-build-actions">
    <el-button v-if="active > 1" :disabled="uiPending.save || uiPending.build" @click="last">上一步</el-button>
    <el-button v-if="active < 4" type="primary" :loading="uiPending.build" @click="uiNext">{{ active === 3 ? '生成 JSON 并继续' : '下一步' }}</el-button>
    <el-button v-else type="primary" :loading="uiPending.save" :disabled="uiPending.build" @click="uiSaveBuiltTask">创建同步任务</el-button>
  </div>
  <el-drawer title="选择调度模板" :visible.sync="jobTemplateSelectDrawer" size="80%" append-to-body>
    <div class="datax-config-drawer">
      <div class="ui-filter">
        <el-input v-model="listQuery.jobDesc" clearable placeholder="搜索模板名称" @keyup.enter.native="uiSearch">
        </el-input>
        <el-button :loading="uiRead.loading" @click="uiSearch">查询</el-button>
      </div>
      <ui-data-state :state="uiPageState" @retry="fetchData">
      </ui-data-state>
      <el-table v-loading="uiRead.loading" :data="list || []" row-key="id">
        <el-table-column prop="jobDesc" label="模板名称" min-width="220">
        </el-table-column>
        <el-table-column prop="projectName" label="所属项目" min-width="180">
        </el-table-column>
        <el-table-column prop="jobCron" label="Cron" min-width="160">
        </el-table-column>
        <el-table-column label="操作" width="90">
          <template slot-scope="scope">
            <el-button type="text" @click="uiChooseTemplate(scope.row)">使用</el-button>
          </template>
        </el-table-column>
      </el-table>
      <ui-pagination :total="total" :current.sync="listQuery.current" :size.sync="listQuery.size" @change="fetchData">
      </ui-pagination>
    </div>
  </el-drawer>
</section>
