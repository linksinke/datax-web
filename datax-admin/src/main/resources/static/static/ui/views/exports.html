<section class="app-container ui-page">
  <div class="ui-filter"><span class="ui-hint">文件按当前账号保存，可重复下载并追踪下载次数。</span><span class="ui-filter-spacer"></span><el-button icon="el-icon-refresh" :loading="uiRead.loading" @click="uiRefresh">刷新记录</el-button><el-button @click="$router.push('/datax/job/configTemplate')">前往配置批次</el-button></div>
  <ui-data-state :state="uiPageState" @retry="uiRefresh"></ui-data-state>
  <el-table :data="list" v-loading="uiRead.loading" row-key="id" empty-text="暂无导出记录。请在配置批次或模板详情中提交导出。">
    <el-table-column prop="name" label="归档文件" min-width="310" show-overflow-tooltip></el-table-column>
    <el-table-column label="来源" min-width="180"><template slot-scope="scope">{{ uiExportType(scope.row.scopeType) }}<small class="ui-cell-secondary">{{ scope.row.scopeId }}</small></template></el-table-column>
    <el-table-column prop="fileCount" label="配置数" width="90"></el-table-column><el-table-column label="大小" width="110"><template slot-scope="scope">{{ uiBytes(scope.row.fileSize) }}</template></el-table-column>
    <el-table-column prop="downloadCount" label="下载次数" width="100"></el-table-column><el-table-column prop="createdAt" label="生成时间" min-width="170"></el-table-column>
    <el-table-column label="操作" width="110" fixed="right"><template slot-scope="scope"><el-button type="text" icon="el-icon-download" :loading="uiBusy('download-' + scope.row.id)" @click="uiDownload(scope.row)">下载</el-button></template></el-table-column>
  </el-table>
  <ui-pagination :total="total" :current.sync="listQuery.current" :size.sync="listQuery.size" :updated-at="uiRead.updatedAt" @change="uiRefresh"></ui-pagination>
</section>
