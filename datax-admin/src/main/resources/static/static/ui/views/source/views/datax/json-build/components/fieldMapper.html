<section class="ui-mapping-workspace"><header class="ui-section-intro"><h3>字段映射与顺序</h3><p>左右同序号一一对应，可用上下按钮调整顺序。请在继续前核对数量和含义。</p></header>
 <el-alert v-if="readerForm.lcolumns.length !== readerForm.rcolumns.length" title="左右数量不一致，请补齐配对后继续。" type="warning" :closable="false" show-icon></el-alert><div class="datax-config-sides"><section class="ui-mapping-side"><h4>源端字段 <small>{{ readerForm.lcolumns.length }} 项</small></h4><el-checkbox :value="fromColumnsList.length > 0 && readerForm.lcolumns.length === fromColumnsList.length" :indeterminate="readerForm.lcolumns.length > 0 && readerForm.lcolumns.length < fromColumnsList.length" @change="lHandleCheckAllChange">全选</el-checkbox><el-checkbox-group v-model="readerForm.lcolumns" class="ui-selection-grid" @change="lHandleCheckedChange"><el-checkbox v-for="item in fromColumnsList" :key="item" :label="item">{{ item }}</el-checkbox></el-checkbox-group><div class="ui-mapping-order"><div v-for="(item,index) in readerForm.lcolumns" :key="item"><el-tag size="mini">{{ index + 1 }}</el-tag><span>{{ item }}</span><el-button type="text" icon="el-icon-top" :disabled="index === 0" aria-label="上移" @click="uiMoveSelected('l',index,-1)"></el-button><el-button type="text" icon="el-icon-bottom" :disabled="index === readerForm.lcolumns.length - 1" aria-label="下移" @click="uiMoveSelected('l',index,1)"></el-button></div></div></section><section class="ui-mapping-side"><h4>目标字段 <small>{{ readerForm.rcolumns.length }} 项</small></h4><el-checkbox :value="toColumnsList.length > 0 && readerForm.rcolumns.length === toColumnsList.length" :indeterminate="readerForm.rcolumns.length > 0 && readerForm.rcolumns.length < toColumnsList.length" @change="rHandleCheckAllChange">全选</el-checkbox><el-checkbox-group v-model="readerForm.rcolumns" class="ui-selection-grid" @change="rHandleCheckedChange"><el-checkbox v-for="item in toColumnsList" :key="item" :label="item">{{ item }}</el-checkbox></el-checkbox-group><div class="ui-mapping-order"><div v-for="(item,index) in readerForm.rcolumns" :key="item"><el-tag size="mini">{{ index + 1 }}</el-tag><span>{{ item }}</span><el-button type="text" icon="el-icon-top" :disabled="index === 0" aria-label="上移" @click="uiMoveSelected('r',index,-1)"></el-button><el-button type="text" icon="el-icon-bottom" :disabled="index === readerForm.rcolumns.length - 1" aria-label="下移" @click="uiMoveSelected('r',index,1)"></el-button></div></div></section></div></section>
