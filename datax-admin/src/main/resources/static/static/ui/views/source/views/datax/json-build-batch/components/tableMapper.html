<section class="ui-mapping-workspace"><header class="ui-section-intro"><h3>表映射与顺序</h3><p>左右同序号一一对应，可用上下按钮调整顺序。请在继续前核对数量和含义。</p></header>
 <el-alert v-if="readerForm.ltables.length !== readerForm.rtables.length" title="左右数量不一致，请补齐配对后继续。" type="warning" :closable="false" show-icon></el-alert><div class="datax-config-sides"><section class="ui-mapping-side"><h4>源端表 <small>{{ readerForm.ltables.length }} 项</small></h4><el-checkbox :value="fromTablesList.length > 0 && readerForm.ltables.length === fromTablesList.length" :indeterminate="readerForm.ltables.length > 0 && readerForm.ltables.length < fromTablesList.length" @change="lHandleCheckAllChange">全选</el-checkbox><el-checkbox-group v-model="readerForm.ltables" class="ui-selection-grid" @change="lHandleCheckedChange"><el-checkbox v-for="item in fromTablesList" :key="item" :label="item">{{ item }}</el-checkbox></el-checkbox-group><div class="ui-mapping-order"><div v-for="(item,index) in readerForm.ltables" :key="item"><el-tag size="mini">{{ index + 1 }}</el-tag><span>{{ item }}</span><el-button type="text" icon="el-icon-top" :disabled="index === 0" aria-label="上移" @click="uiMoveSelected('l',index,-1)"></el-button><el-button type="text" icon="el-icon-bottom" :disabled="index === readerForm.ltables.length - 1" aria-label="下移" @click="uiMoveSelected('l',index,1)"></el-button></div></div></section><section class="ui-mapping-side"><h4>目标表 <small>{{ readerForm.rtables.length }} 项</small></h4><el-checkbox :value="toTablesList.length > 0 && readerForm.rtables.length === toTablesList.length" :indeterminate="readerForm.rtables.length > 0 && readerForm.rtables.length < toTablesList.length" @change="rHandleCheckAllChange">全选</el-checkbox><el-checkbox-group v-model="readerForm.rtables" class="ui-selection-grid" @change="rHandleCheckedChange"><el-checkbox v-for="item in toTablesList" :key="item" :label="item">{{ item }}</el-checkbox></el-checkbox-group><div class="ui-mapping-order"><div v-for="(item,index) in readerForm.rtables" :key="item"><el-tag size="mini">{{ index + 1 }}</el-tag><span>{{ item }}</span><el-button type="text" icon="el-icon-top" :disabled="index === 0" aria-label="上移" @click="uiMoveSelected('r',index,-1)"></el-button><el-button type="text" icon="el-icon-bottom" :disabled="index === readerForm.rtables.length - 1" aria-label="下移" @click="uiMoveSelected('r',index,1)"></el-button></div></div></section></div></section>
