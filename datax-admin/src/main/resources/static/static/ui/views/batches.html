<section class="app-container datax-config-page ui-page">
  <header class="ui-panel-title">
    <h2>{{ $route.query.batchId ? (batch ? batch.batchCode : '批次') + ' / 模板' : 'JSON 配置批次' }}</h2>
    <el-button v-if="$route.query.batchId" @click="back">返回批次列表</el-button>
  </header>
  <p class="ui-hint">{{ $route.query.batchId ? '选择文件预览或编辑，也可以下载整个批次。' : '按批次管理生成的配置文件，支持整批 ZIP 下载。' }}</p>
  <div class="ui-filter" style="padding-top: 20px">
    <el-input v-model="keyword" clearable :placeholder="$route.query.batchId ? '表名 / JSON 文件名' : '批次编码 / 批次说明'" prefix-icon="el-icon-search" @keyup.enter.native="current = 1; fetch()">
    </el-input>
    <el-button :loading="loading" @click="current = 1; fetch()">查询</el-button>
    <el-button @click="keyword = ''; current = 1; fetch()">重置</el-button>
    <span class="ui-filter-spacer">
    </span>
    <el-button v-if="$route.query.batchId && batch" :loading="downloadingId === batch.id" @click="downloadGroup(batch)">下载整个批次</el-button>
    <el-button v-if="$route.query.batchId" :disabled="!selected.length" :loading="downloading" @click="downloadSelected">下载所选（{{ selected.length }}）</el-button>
    <el-button type="primary" icon="el-icon-plus" @click="newTemplate">批量生成模板</el-button>
  </div>
  <ui-data-state :state="{error: uiBatchError}" @retry="fetch">
  </ui-data-state>
  <el-table v-loading="loading" :data="rows" row-key="id" empty-text="暂无生成记录，点击批量生成模板开始" @selection-change="selected = $event">
    <template v-if="$route.query.batchId">
      <el-table-column type="selection" width="45">
      </el-table-column>
      <el-table-column prop="fileName" label="JSON 文件名" min-width="340" show-overflow-tooltip>
      </el-table-column>
      <el-table-column label="源库 / 目标库" min-width="220">
        <template slot-scope="scope">
          <span>{{ sourceName(scope.row.readerDatasourceId) }} → {{ sourceName(scope.row.writerDatasourceId) }}</span>
          <small class="ui-cell-secondary">{{ scope.row.readerTable }} → {{ scope.row.writerTable }}</small>
        </template>
      </el-table-column>
      <el-table-column prop="updateTime" label="更新时间" min-width="175">
      </el-table-column>
      <el-table-column label="操作" width="190" fixed="right">
        <template slot-scope="scope">
          <div class="ui-row-actions">
            <el-button type="text" @click="open(scope.row)">预览 / 编辑</el-button>
            <el-button type="text" @click="download(scope.row)">下载</el-button>
            <el-button type="text" class="ui-danger" @click="remove(scope.row)">删除</el-button>
          </div>
        </template>
      </el-table-column>
    </template>
    <template v-else>
      <el-table-column label="批次" min-width="230">
        <template slot-scope="scope">
          <el-button type="text" @click="openBatch(scope.row)">{{ scope.row.batchCode }}</el-button>
        </template>
      </el-table-column>
      <el-table-column prop="name" label="批次说明" min-width="240" show-overflow-tooltip>
      </el-table-column>
      <el-table-column prop="templateCount" label="文件数" width="100">
      </el-table-column>
      <el-table-column prop="createTime" label="生成时间" min-width="175">
      </el-table-column>
      <el-table-column label="操作" width="220" fixed="right">
        <template slot-scope="scope">
          <div class="ui-row-actions">
            <el-button type="text" @click="openBatch(scope.row)">查看模板</el-button>
            <el-button type="text" :loading="downloadingId === scope.row.id" @click="downloadGroup(scope.row)">下载批次 ZIP</el-button>
          </div>
        </template>
      </el-table-column>
    </template>
  </el-table>
  <ui-pagination :total="total" :current.sync="current" :size="10" @change="fetch">
  </ui-pagination>
</section>
