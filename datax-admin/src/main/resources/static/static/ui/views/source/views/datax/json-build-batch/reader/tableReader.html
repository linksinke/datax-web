<section class="ui-builder-pane"><header class="ui-section-intro"><h3>读取端连接与表范围</h3><p>选择参与构建的表；下一步可以调整左右顺序，同序号的表形成一组任务。</p></header><el-form label-position="top" :model="readerForm" :rules="rules" class="ui-form-grid"><el-form-item label="读取端数据源" prop="datasourceId"><el-select v-model="readerForm.datasourceId" filterable clearable placeholder="选择可连接的数据库" :loading="loading" @change="rDsChange"><el-option v-for="source in rDsList" :key="source.id" :label="source.datasourceName" :value="source.id"></el-option></el-select></el-form-item>
 <el-form-item v-show="['postgresql','oracle','sqlserver'].includes(dataSource)" label="Schema"><el-select v-model="readerForm.tableSchema" filterable @change="schemaChange"><el-option v-for="schema in schemaList" :key="schema" :label="schema" :value="schema"></el-option></el-select></el-form-item><el-form-item label="切分字段（选填）"><el-input v-model="readerForm.splitPk" placeholder="数值型切分主键"></el-input></el-form-item><el-form-item label="源表" class="ui-span-full"><div class="ui-selection-header"><el-checkbox :value="rTbList.length > 0 && readerForm.tables.length === rTbList.length" :indeterminate="readerForm.tables.length > 0 && readerForm.tables.length < rTbList.length" @change="rHandleCheckAllChange">全选</el-checkbox><span>已选 {{ readerForm.tables.length }} / {{ rTbList.length }} 张表</span></div><el-checkbox-group v-model="readerForm.tables" class="ui-selection-grid" @change="rHandleCheckedChange"><el-checkbox v-for="table in rTbList" :key="table" :label="table">{{ table }}</el-checkbox></el-checkbox-group><p v-if="!rTbList.length" class="ui-empty-text">选择数据源后读取可用表。</p></el-form-item></el-form></section>
