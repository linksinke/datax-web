<header class="navbar">
  <div class="ui-navigation-trail">
    <hamburger class="hamburger-container" :is-active="sidebar.opened" @toggleClick="toggleSideBar">
    </hamburger>
    <breadcrumb class="breadcrumb-container">
    </breadcrumb>
  </div>
  <div class="ui-topbar-actions">
    <el-button class="ui-quick-search" icon="el-icon-search" @click="uiOpenSearch">
      查找页面
      <kbd>Ctrl K</kbd>
    </el-button>
    <el-tooltip :content="uiWorkbench.available ? '查看后台作业' : '后台服务暂不可用，重启管理端后刷新'" placement="bottom">
      <el-badge :value="uiWorkbench.running" :hidden="!uiWorkbench.running" type="primary" class="ui-topbar-badge">
        <el-button class="ui-icon-button" icon="el-icon-finished" aria-label="后台作业" @click="$router.push('/datax/operations/jobs')"></el-button>
      </el-badge>
    </el-tooltip>
    <el-badge :value="uiWorkbench.unread" :hidden="!uiWorkbench.unread" :max="99" class="ui-topbar-badge">
      <el-button class="ui-icon-button" icon="el-icon-bell" aria-label="完成通知" @click="uiOpenNotifications"></el-button>
    </el-badge>
    <el-dropdown trigger="click">
      <button class="ui-account" type="button">
        <i class="el-icon-user">
        </i>
        <span>{{ uiUsername }}</span>
        <i class="el-icon-arrow-down">
        </i>
      </button>
      <el-dropdown-menu slot="dropdown">
        <el-dropdown-item icon="el-icon-user" @click.native="$router.push('/profile/index')">当前账号</el-dropdown-item>
        <el-dropdown-item icon="el-icon-switch-button" divided @click.native="logout">退出登录</el-dropdown-item>
      </el-dropdown-menu>
    </el-dropdown>
  </div>
  <el-dialog title="查找页面" :visible.sync="uiSearchVisible" width="560px" custom-class="ui-search-dialog" append-to-body>
    <el-input ref="uiSearchInput" v-model="uiSearchQuery" clearable placeholder="搜索菜单或功能名称" prefix-icon="el-icon-search" @input="uiSearchIndex = 0" @keydown.down.native.prevent="uiMoveSearch(1)" @keydown.up.native.prevent="uiMoveSearch(-1)" @keydown.enter.native.prevent="uiChooseSearch(uiSearchResults[uiSearchIndex])">
    </el-input>
    <div class="ui-search-results" role="listbox" aria-label="可访问的页面">
      <button v-for="(item, index) in uiSearchResults" :key="item.path" type="button" :class="{ 'is-active': index === uiSearchIndex }" @click="uiChooseSearch(item)">
        <span>{{ item.title }}</span>
        <small>{{ item.group }}</small>
        <i class="el-icon-arrow-right">
        </i>
      </button>
      <p v-if="!uiSearchResults.length" class="ui-empty-text">没有匹配的页面，试试其他关键词。</p>
    </div>
  </el-dialog>
  <el-drawer title="后台操作通知" :visible.sync="uiNotificationsVisible" size="min(420px, 96vw)" append-to-body>
    <div class="ui-notification-panel">
      <div class="ui-panel-title"><span class="ui-hint">{{ uiWorkbench.unread }} 条未读通知</span><el-button type="text" :disabled="!uiWorkbench.unread" @click="uiReadNotifications">全部已读</el-button></div>
      <p v-if="!uiWorkbench.records.length" class="ui-empty-text">暂无完成通知。生成、复制和导出结束后会在这里通知。</p>
      <button v-for="notice in uiWorkbench.records" :key="notice.id" type="button" class="ui-notice" :class="{ 'is-unread': !notice.readAt }" @click="uiOpenNotice(notice)">
        <i :class="notice.state === 'SUCCEEDED' ? 'el-icon-circle-check ui-success' : 'el-icon-warning-outline ui-danger'"></i>
        <span><strong>{{ notice.name }}</strong><small>{{ notice.message }}</small><time>{{ notice.finishedAt }}</time></span>
        <i class="el-icon-arrow-right"></i>
      </button>
      <el-button class="ui-full-width" @click="uiNotificationsVisible=false; $router.push('/datax/operations/jobs')">查看全部后台作业</el-button>
    </div>
  </el-drawer>
</header>
