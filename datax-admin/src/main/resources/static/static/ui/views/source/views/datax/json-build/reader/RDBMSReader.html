<section class="ui-builder-pane"><header class="ui-section-intro"><h3>读取端连接与数据范围</h3><p>当前向导直接连接此数据源读取结构。需要使用本地模拟库时，请使用配置中心的项目方案。</p></header><el-form label-position="top" :model="readerForm" :rules="rules" class="ui-form-grid"><el-form-item label="读取端数据源" prop="datasourceId"><el-select v-model="readerForm.datasourceId" filterable clearable placeholder="选择可连接的数据库" :loading="loading" @change="rDsChange"><el-option v-for="source in rDsList" :key="source.id" :label="source.datasourceName" :value="source.id"></el-option></el-select></el-form-item>
 <el-form-item v-show="['postgresql','oracle','sqlserver'].includes(dataSource)" label="Schema"><el-select v-model="readerForm.tableSchema" filterable @change="schemaChange"><el-option v-for="schema in schemaList" :key="schema" :label="schema" :value="schema"></el-option></el-select></el-form-item><el-form-item label="源表" prop="tableName"><el-select v-model="readerForm.tableName" filterable allow-create default-first-option placeholder="选择表，或输入完整表名" @change="rTbChange"><el-option v-for="table in rTbList" :key="table" :label="table" :value="table"></el-option></el-select></el-form-item><el-form-item label="切分字段（选填）"><el-input v-model="readerForm.splitPk" placeholder="数值型主键，用于并发切分"></el-input></el-form-item>
 <el-form-item label="读取 SQL（选填）" class="ui-span-full"><el-input v-model="readerForm.querySql" class="ui-code" type="textarea" :rows="5" resize="none" placeholder="SELECT id AS id, name AS name FROM orders"></el-input><div class="ui-inline-help"><span>查询模式以输出字段为准，编辑后请重新解析。</span><el-button size="small" :disabled="!readerForm.datasourceId || !readerForm.querySql" @click.prevent="getColumns('reader')">解析输出字段</el-button></div></el-form-item><el-form-item label="读取字段" class="ui-span-full"><div class="ui-selection-header"><el-checkbox :value="rColumnList.length > 0 && readerForm.columns.length === rColumnList.length" :indeterminate="readerForm.columns.length > 0 && readerForm.columns.length < rColumnList.length" @change="rHandleCheckAllChange">全选</el-checkbox><span>已选 {{ readerForm.columns.length }} / {{ rColumnList.length }} 个字段</span></div><el-checkbox-group v-model="readerForm.columns" class="ui-selection-grid" @change="rHandleCheckedChange"><el-checkbox v-for="column in rColumnList" :key="column" :label="column">{{ column }}</el-checkbox></el-checkbox-group><p v-if="!rColumnList.length" class="ui-empty-text">选择表后读取字段；查询模式请点击解析输出字段。</p></el-form-item><el-form-item label="WHERE 条件（选填）" class="ui-span-full"><el-input v-model="readerForm.where" class="ui-code" type="textarea" :rows="2" resize="none" placeholder="例如 status = 1，无需填写 WHERE"></el-input></el-form-item></el-form></section>
