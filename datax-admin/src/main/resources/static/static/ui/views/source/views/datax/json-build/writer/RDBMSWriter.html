<section class="ui-builder-pane"><header class="ui-section-intro"><h3>写入端连接与数据范围</h3><p>当前向导直接连接此数据源读取结构。需要使用本地模拟库时，请使用配置中心的项目方案。</p></header><el-form label-position="top" :model="writerForm" :rules="rules" class="ui-form-grid"><el-form-item label="写入端数据源" prop="datasourceId"><el-select v-model="writerForm.datasourceId" filterable clearable placeholder="选择可连接的数据库" @change="wDsChange"><el-option v-for="source in wDsList" :key="source.id" :label="source.datasourceName" :value="source.id"></el-option></el-select></el-form-item>
 <el-form-item v-show="['postgresql','oracle','sqlserver'].includes(dataSource)" label="Schema"><el-select v-model="writerForm.tableSchema" filterable @change="schemaChange"><el-option v-for="schema in schemaList" :key="schema" :label="schema" :value="schema"></el-option></el-select></el-form-item><el-form-item label="目标表" prop="tableName"><el-select v-model="fromTableName" filterable allow-create default-first-option placeholder="选择表，或输入完整表名" @change="wTbChange"><el-option v-for="table in wTbList" :key="table" :label="table" :value="table"></el-option></el-select></el-form-item><el-form-item v-if="writerForm.ifCreateTable" label="实际写入表"><el-input v-model="writerForm.tableName" placeholder="请输入目标表名"></el-input></el-form-item><el-form-item label="写入字段" class="ui-span-full"><div class="ui-selection-header"><el-checkbox :value="fromColumnList.length > 0 && writerForm.columns.length === fromColumnList.length" :indeterminate="writerForm.columns.length > 0 && writerForm.columns.length < fromColumnList.length" @change="wHandleCheckAllChange">全选</el-checkbox><span>已选 {{ writerForm.columns.length }} / {{ fromColumnList.length }} 个字段</span></div><el-checkbox-group v-model="writerForm.columns" class="ui-selection-grid" @change="wHandleCheckedChange"><el-checkbox v-for="column in fromColumnList" :key="column" :label="column">{{ column }}</el-checkbox></el-checkbox-group><p v-if="!fromColumnList.length" class="ui-empty-text">选择表后读取字段；查询模式请点击解析输出字段。</p></el-form-item><el-form-item label="前置 SQL（选填）"><el-input v-model="writerForm.preSql" class="ui-code" type="textarea" :rows="4" resize="none" placeholder="在写入之前执行，多个语句用分号分隔"></el-input></el-form-item><el-form-item label="后置 SQL（选填）"><el-input v-model="writerForm.postSql" class="ui-code" type="textarea" :rows="4" resize="none" placeholder="在写入完成后执行，多个语句用分号分隔"></el-input></el-form-item></el-form></section>
